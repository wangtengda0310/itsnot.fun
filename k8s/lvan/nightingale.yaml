apiVersion: apps/v1
kind: Deployment
metadata:
  name: nightingale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nightingale
  template:
    metadata:
      labels:
        app: nightingale
    spec:
      containers:
        - name: nightingale
          image: nightingale:latest
          ports:
            - containerPort: 80
          env:
            - name: "ELASTICSEARCH_URL"
              value: "http://elasticsearch-service:9200"
            - name: "ELASTICSEARCH_HOST"
              value: "elasticsearch-service"
            - name: "ELASTICSEARCH_PORT"
              value: "9200"
          # 其他环境变量...
---
apiVersion: v1
kind: Service
metadata:
  name: nightingale
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: nightingale
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nightingale-config
data:
  nightingale.yml: |
    server.name: "Nightingale"
    server.host: "0.0.0.0"
    elasticsearch.hosts: ["http://elasticsearch-service:9200"]
    # 其他配置...
---
