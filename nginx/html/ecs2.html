<body>
<div id="stats">
    <p id="fps">FPS: 0</p>
    <p id="entityCount">Entities: 0</p>

<canvas id="canvas"></canvas>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

class SparseSet {
    constructor() {
        this.densePos = 0;
        this.dense = [];
        this.sparse = [];
    }
    add(entity) {
        this.dense.push(entity);
        this.sparse[entity[0]] = this.densePos;
        this.densePos += 1;
    }
    remove(entity) {
        this.densePos -= 1;
        let swap = this.dense[this.densePos];
        let remove = this.sparse[entity];
        this.dense[remove] = swap;
        this.sparse[entity] = 0;
    }
    exists(entity) {
        let pos = this.sparse[entity]
        return pos < this.densePos && this.dense[pos][0]==entity;
    }
}

    // ECS components
    class PositionComponent extends SparseSet {}
    class VelocityComponent extends SparseSet {}
    class SizeComponent extends SparseSet {}
    class ColorComponent extends SparseSet {}

    class Position {
        constructor(x, y) {
            this.x = x;
            this.y = y;
        }
    }

    class Velocity {
        constructor(vx, vy) {
            this.vx = vx;
            this.vy = vy;
        }
    }

    class KeyEventComponent extends SparseSet {
    }


    class System {
        update(){}
        getComponents(){}
    }

    // ECS Systems
    class MovementSystem extends SparseSet {

    constructor(posComponent, velComponent) {
        super();
        this.posComponent = posComponent;
        this.velComponent = velComponent;
    }

        update(currentTime, deltaTime) {
            for (let i = 0; i < this.posComponent.densePos; i++) {
                const pos = this.posComponent.dense[i][1];
                const vel = this.velComponent.dense[i][1];
                if (pos && vel) {
                    // Move the entity by a fixed amount (5 pixels per frame)
                    pos.x += vel.vx;
                    pos.y += vel.vy;

                    // Wrap around the screen
                    if (pos.x < 0) pos.x = canvas.width;
                    if (pos.x > canvas.width) pos.x = 0;
                    if (pos.y < 0) pos.y = canvas.height;
                    if (pos.y > canvas.height) pos.y = 0;
                }
            }
        }
    }

    class RenderSystem {
        constructor(positionComponent, sizeComponent, colorComponent) {
            this.bufferCanvas = document.createElement('canvas');
            this.bufferCanvas.width = canvas.width;
            this.bufferCanvas.height = canvas.height;
            this.bufferCtx = this.bufferCanvas.getContext('2d');

            this.positionComponent = positionComponent;
            this.sizeComponent = sizeComponent;
            this.colorComponent = colorComponent;
        }

        update(currentTime, deltaTime) {
            // Clear the buffer canvas
            this.bufferCtx.clearRect(0, 0, this.bufferCanvas.width, this.bufferCanvas.height);

            // Draw all entities with random colors
            for (let i = 0; i < this.positionComponent.densePos; i++) {
                const pos = this.positionComponent.dense[i];
                const size = this.sizeComponent.dense[i];
                const color = this.colorComponent.dense[i];
                if (pos && pos[1] && size && size[1]) {
                    this.bufferCtx.beginPath();
                    this.bufferCtx.arc(pos[1].x, pos[1].y, size[1], 0, Math.PI * 2); // Smaller size for optimization
                    this.bufferCtx.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
                    this.bufferCtx.fill();
                } else {
        }
            }

            // Copy buffer canvas to the main canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(this.bufferCanvas, 0, 0);
        }
    }

    class FPSSystem extends SparseSet {
        constructor(positionComponent) {
        super();
        this.positionComponent = positionComponent;
            this.lastTime = 0;
            this.fps = 0;
            this.frames = 0;
        }

        update(currentTime, systemDeltaTime) {
            this.frames++;
            const deltaTime = (currentTime - this.lastTime) / 1000;
            if (deltaTime >= 1) {
                this.fps = this.frames;
                this.frames = 0;
                this.lastTime = currentTime;
            }
        }

        draw() {
            document.getElementById('fps').innerText = `FPS: ${this.fps}`;
            document.getElementById('entityCount').innerText = `Entities: ${this.positionComponent.densePos}`;
        }
    }

    class DragAreaSystem extends SparseSet {
        constructor(canvas, positionComponent) {
        super();
        this.positionComponent = positionComponent;
        this.reset();

        // Mouse down event: Start dragging
        canvas.addEventListener('mousedown', (e) => {
            this.dragStartX = e.clientX;
            this.dragStartY = e.clientY;
            this.dragEndX = e.clientX;
            this.dragEndY = e.clientY;
            this.isDragging = true;
        });

        // Mouse move event: Update drag area
        canvas.addEventListener('mousemove', (e) => {
            if (this.isDragging) {
                this.dragEndX = e.clientX;
                this.dragEndY = e.clientY;
            }
        });

        let dragSystem = this;

        // Mouse up event: Stop dragging and remove entities in the drag area
        canvas.addEventListener('mouseup', (e) => {
            dragSystem.clear();
            dragSystem.reset();
        });

        }

    reset() {
        // Flag to determine if dragging
        this.isDragging = false;

        // Mouse drag to clear entities
        this.dragStartX = 0
        this.dragStartY = 0;
        this.dragEndX = 0
        this.dragEndY = 0;
    }

        update(currentTime, deltaTime) {
            let positionComponent = this.positionComponent;
            this.clear = function() {
                const minX = Math.min(this.dragStartX, this.dragEndX);
                const maxX = Math.max(this.dragStartX, this.dragEndX);
                const minY = Math.min(this.dragStartY, this.dragEndY);
                const maxY = Math.max(this.dragStartY, this.dragEndY);

                // Remove entities within the dragged area
                for (let i = this.positionComponent.densePos - 1; i >= 0; i--) {
                    let positionDense = this.positionComponent.dense[i];
                    const pos = positionDense[1];
                    if (pos && pos.x >= minX && pos.x <= maxX && pos.y >= minY && pos.y <= maxY) {
                            this.positionComponent.remove(positionDense[0]);
                    }
                }
            }

        }

        draw() {
        // If dragging, draw the dragging rectangle after everything else
        if (this.isDragging) {
            // Draw the drag area (this should be on top)
            ctx.fillStyle = 'rgba(173, 216, 230, 0.5)'; // Light blue with 50% transparency
            ctx.strokeStyle = 'black';  // Black border, fully opaque
            ctx.lineWidth = 2;  // Set border width
            ctx.beginPath();
            ctx.rect(this.dragStartX, this.dragStartY, this.dragEndX - this.dragStartX, this.dragEndY - this.dragStartY);
            ctx.fill();  // Fill the rectangle
            ctx.stroke();  // Draw the border
        }

        }
    }

class KeyEventSystem extends System {
    constructor(spaceKeyPressedComponent, positionComponent, velocityComponent, sizeComponent, colorComponent) {
        super();
        this.spaceKeyPressedComponent = spaceKeyPressedComponent;
        this.positionComponent = positionComponent;
        this.velocityComponent = velocityComponent;
        this.sizeComponent = sizeComponent;
        this.colorComponent = colorComponent;

        let i = 0;
        addEventListener('keydown', function (event) {
            // 检查是否按下了空格键
            if (event.code === 'Space') {
                // 阻止默认行为（例如滚动页面）
                event.preventDefault();
                spaceKeyPressedComponent.add(i++);
            }
        });
    }

    addEventListener(eventType, callback) {
        document.addEventListener(eventType, callback);
    }

    update() {
        if (this.spaceKeyPressedComponent.densePos == 0) {
            return;
        }
        this.spaceKeyPressedComponent.densePos = 0;
        console.log(this.spaceKeyPressedComponent.dense);
        // Create entities with random movement and position
        for (let i = this.positionComponent.densePos; i < 10000; i++) {
            const position = new Position(0.1 * Math.random() * canvas.width, 0.1 * Math.random() * canvas.height);
            this.positionComponent.add([i,position]);
            const velocity = new Velocity(Math.random() * 10 - 5, Math.random() * 10 - 5); // Random velocity between -5 and 5
            this.velocityComponent.add([i,velocity]);
            this.sizeComponent.add([i, 5]);
            let color = [Math.floor(Math.random() * 256), Math.floor(Math.random() * 256), Math.floor(Math.random() * 256)]; // Random color
            this.colorComponent.add(color); // Each entity has a unique color

            }
    }
}

    // ECS manager
    class ECSManager {
        constructor() {
            this.systems = [];
            this.component = [];
        }


        addSystem(system) {
            console.log("register component")
            this.systems.push(system);

            if (system.getComponents!=null) {
                let components = system.getComponents()
                if (components == null) return;

                components.forEach(c=>{
                    if (!this.component[c.getEntityGroup()]) {
                        this.component[c.getEntityGroup()] = []
                    }
                    this.component[c.getEntityGroup()].push(c.getEntityId())
                })
            }
console.log(this.component);
        }

        update(currentTime, deltaTime) {
            this.component.forEach(c => {
                this.systems.forEach(system => system.updateone && system.updateone(c,c,c,c));
            })
            this.systems.forEach(system => system.update(currentTime, deltaTime));
        }

        render() {
            this.systems.forEach(system => system.draw && system.draw());
        }
    }

    // Initialization
    const ecsManager = new ECSManager();

    const positionComponent = new PositionComponent();
    const velComponent = new VelocityComponent();
    const sizeComponent = new SizeComponent();
    const colorComponent = new ColorComponent();
    const keyEventComponent = new KeyEventComponent();

    ecsManager.addSystem(new MovementSystem(positionComponent,velComponent));
    ecsManager.addSystem(new RenderSystem(positionComponent, sizeComponent, colorComponent));
    ecsManager.addSystem(new FPSSystem(positionComponent));
    //ecsManager.addSystem(new DragAreaSystem(canvas, positionComponent));
    ecsManager.addSystem(new KeyEventSystem(keyEventComponent,positionComponent,velComponent, sizeComponent, colorComponent));

    // Game loop
    let lastTime = 0;

    function gameLoop(currentTime) {
        const deltaTime = (currentTime - lastTime) / 1000;
        lastTime = currentTime;

        // Update ECS systems
        ecsManager.update(currentTime, deltaTime);

        // Render systems (e.g., render entities)
        ecsManager.render();

        // Draw the FPS and Entity count
        // fpsSystem.update(currentTime);
        // fpsSystem.draw();

        // Request next frame
        requestAnimationFrame(gameLoop);
    }

    // Start the game loop
    requestAnimationFrame(gameLoop);
</script>
